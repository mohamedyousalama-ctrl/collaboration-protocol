name: Reconstruct and inventory authoritative CP incident corpus v1

on:
  push:
    branches:
      - research/fan-corpus-validation-2026-08-22
    paths:
      - '.github/workflows/reconstruct-cp-incident-v1.yml'
      - 'research/fan-corpus-validation/tools/reconstruct_authoritative_v1.py'
      - 'research/fan-corpus-validation/recovered-source/CP_Incident_Database_v1.xlsx.b64.part-*'

permissions:
  contents: write

jobs:
  reconstruct:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout research branch
        uses: actions/checkout@v4
        with:
          ref: research/fan-corpus-validation-2026-08-22
          fetch-depth: 1

      - name: Reconstruct exact v1, verify identity, and inventory workbook
        run: python3 research/fan-corpus-validation/tools/reconstruct_authoritative_v1.py

      - name: Commit verified working copy and audit inputs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add research/fan-corpus-validation/work/
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "research: verify and inventory authoritative 52-record corpus v1 [skip ci]"
            git push origin HEAD:research/fan-corpus-validation-2026-08-22
          fi
